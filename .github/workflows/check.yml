name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q scripts templates
      - run: python -m unittest discover -s tests
